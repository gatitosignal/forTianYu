<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b130b">
  <meta name="description" content="开业大酬宾 · 抽霸王餐，参与幸运转盘抽奖！">
  <title>开业大酬宾 · 抽霸王餐</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #2b130b;
      --panel: #411c10;
      --red: #e74935;
      --red-hi: #ff7351;
      --cream: #fff2dd;
      --gold: #ffcf77;
      --muted: #e8c4a8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--cream);
      overflow: hidden;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .page {
      isolation: isolate;
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: 530px;
      margin: auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(12px, env(safe-area-inset-top)) 17px max(12px, env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse 85% 35% at 50% 5%, rgba(183,76,32,.30), transparent 80%),
        radial-gradient(ellipse 130% 45% at 50% 104%, rgba(130,40,14,.42), transparent 65%),
        linear-gradient(180deg, #3b1b10 0%, #2a120b 34%, #38190d 70%, #24110a 100%);
    }
    /* 无外链图片的烤肉氛围：炭火光晕、烤架纹理和飘散火星 */
    .page::before {
      content: "";
      position: absolute; inset: 0;
      pointer-events: none; z-index: -1; opacity: .58;
      background: repeating-linear-gradient(118deg, transparent 0 40px, rgba(255,192,117,.035) 41px, transparent 43px),
                  radial-gradient(ellipse 50% 20% at 8% 90%, rgba(255,126,38,.3), transparent 75%),
                  radial-gradient(ellipse 50% 20% at 95% 92%, rgba(251,81,31,.25), transparent 80%);
    }
    .embers { position: absolute; inset: 0; overflow: hidden; pointer-events:none; z-index: -1; }
    .embers i { position:absolute; bottom:-10px; width:4px;height:4px; border-radius:50%; background:#ffae60; box-shadow:0 0 9px #f96b23; opacity:0; animation: ember 6s linear infinite; }
    .embers i:nth-child(1){left:12%;animation-delay:0s}.embers i:nth-child(2){left:25%;animation-delay:2.3s;width:3px;height:3px}.embers i:nth-child(3){left:53%;animation-delay:4s}.embers i:nth-child(4){left:79%;animation-delay:1.1s;width:3px;height:3px}.embers i:nth-child(5){left:88%;animation-delay:3.4s}
    @keyframes ember { 0%{transform:translateY(0) scale(.5);opacity:0} 15%{opacity:.85} 76%{opacity:.45} 100%{transform:translateY(-74vh) translateX(25px) scale(.1);opacity:0} }

    .hero { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; flex: 0 0 auto; padding: clamp(13px, 3.1dvh, 28px) 0 clamp(8px, 2dvh, 18px); text-align:center; }
    .hero-title { margin:0; font-size:clamp(29px, 8.1vw, 44px); font-weight:1000; line-height:1.16; letter-spacing: .055em; color:#fff7e8; text-shadow: 0 4px 0 rgba(77,25,10,.8), 0 5px 24px rgba(255,176,86,.26); white-space:nowrap; }
    .title-accent { display:flex; align-items:center; justify-content:center; gap:13px; width:100%; }
    .title-accent::before,.title-accent::after { content:"✦"; font-size:13px; color:var(--gold); filter:drop-shadow(0 0 6px #ffb15c); }
    .title-pill { border:1px solid rgba(255,214,150,.58); border-radius:30px; padding:7px 27px; line-height:1.2; font-size:clamp(17px,5vw,24px); font-weight:900; letter-spacing:.12em; background:linear-gradient(180deg, #f25e3a, #c93120); box-shadow: 0 5px 0 #792319, 0 9px 19px rgba(0,0,0,.27), inset 0 1px 0 rgba(255,255,255,.3); color:#fffdf6; }
    .rule { display:flex; align-items:center; gap:9px; width:min(95%, 430px); color:#f2c79e; font-weight:650; font-size:clamp(10px,2.9vw,13px); letter-spacing:.12em; opacity:.92; margin-top:5px; }
    .rule::before,.rule::after { content:""; height:1px; flex:1; background:linear-gradient(90deg,transparent,#ae6b40,transparent); }

    .game { flex:1 1 auto; min-height:0; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(8px, 2dvh, 18px); }
    .wheel-wrap { position:relative; width:min(calc(100vw - 52px), calc(100dvh - 302px), 432px); max-width:100%; flex:0 1 auto; aspect-ratio:1 / 1; filter:drop-shadow(0 17px 18px rgba(0,0,0,.42)); }
    .wheel-shadow { position:absolute; inset:-9px; border-radius:50%; background:conic-gradient(from -35deg,#ad611d,#ffe0a0 9%,#8d441c 19%,#e9a65d 31%,#8a3619 45%,#ffcd75 64%,#9b451b 81%,#f4c377); box-shadow:0 0 0 3px rgba(83,34,13,.75),0 0 0 6px rgba(255,190,104,.12),inset 0 0 7px #fff6c4; }
    .wheel {
      position:absolute; inset:0; border-radius:50%;
      background:conic-gradient(from -45deg, #fff3e4 0 25%, #ffdfbc 25% 50%, #fff3e4 50% 75%, #ffdfbc 75% 100%);
      border: 7px solid #ffcf7e;
      box-shadow: inset 0 0 0 3px rgba(129,51,19,.35), inset 0 0 18px rgba(149,60,21,.12);
      overflow:hidden;
      transform:rotate(0deg);
      will-change:transform;
    }
    .wheel::after {
      content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none;
      background:linear-gradient(90deg, transparent calc(50% - 2px), #542612 calc(50% - 2px), #542612 calc(50% + 2px), transparent calc(50% + 2px)),
                 linear-gradient(0deg, transparent calc(50% - 2px), #542612 calc(50% - 2px), #542612 calc(50% + 2px), transparent calc(50% + 2px));
      opacity:.88; transform:rotate(45deg);
    }
    .wheel.spinning { transition: transform 4.5s cubic-bezier(.12,.75,.14,1); transform:rotate(1890deg); }
    .segment { position:absolute; z-index:1; width:38%; height:24%; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1px; text-align:center; color:#6b321d; line-height:1.22; user-select:none; }
    .segment .emoji { font-size:clamp(17px,5vw,26px); line-height:1.12; margin-bottom:1px; }
    .segment .level { font-size:clamp(11px,3.4vw,17px); font-weight:850; white-space:nowrap; }
    .segment .reward { font-size:clamp(10px,3vw,15px); font-weight:700; white-space:nowrap; }
    .segment.top { left:31%; top:4%; }
    .segment.right { right:-1%; top:38%; transform:rotate(90deg); }
    .segment.bottom { left:31%; bottom:4%; transform:rotate(180deg); }
    .segment.left { left:-1%; top:38%; transform:rotate(-90deg); }
    .pointer { position:absolute; z-index:5; top:-15px; left:50%; transform:translateX(-50%); width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:31px solid #e43c2b; filter:drop-shadow(0 3px 1px #692516) drop-shadow(0 0 4px #fca65a); }
    .spin-btn {
      position:absolute; z-index:4; width:30%;aspect-ratio:1/1; left:50%;top:50%; transform:translate(-50%,-50%);
      display:flex;flex-direction:column;align-items:center;justify-content:center; gap:0;
      border-radius:50%; border:6px solid #763018; cursor:pointer; touch-action:manipulation;
      background:radial-gradient(circle at 34% 24%,#ff7954 0%, #eb4c33 45%, #d42c24 100%);
      box-shadow:0 0 0 4px #ffdfab, 0 8px 12px #6e291680, inset 0 2px 7px rgba(255,255,255,.3);
      color:#fffdfa;font-size:clamp(14px,4.5vw,23px);line-height:1.18;font-weight:1000;letter-spacing:.11em;
    }
    .spin-btn:active { transform:translate(-50%,-50%) scale(.96); }
    .spin-btn:disabled { cursor:default; opacity:1; }
    .spin-btn:disabled:active {transform:translate(-50%,-50%)}
    .spin-btn span {display:block;}
    .beneath {display:flex; flex-direction:column;align-items:center;gap:7px;text-align:center;}
    .hint {margin:0; font-size:clamp(12px,3.7vw,16px);font-weight:750;letter-spacing:.07em;color:#ffe7c6;}
    .dots {display:flex;gap:7px}.dots i {width:4px;height:4px;background:#f7ad64;transform:rotate(45deg);opacity:.75}
    .footer { flex:0 0 auto; width:100%; display:flex;align-items:center;justify-content:center; padding: clamp(9px,1.7dvh,17px) 0 clamp(3px,.8dvh,9px); }
    .footer span {font-size:clamp(10px,2.7vw,12px);letter-spacing:.18em;color:#bc8967;}

    .overlay {position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(20,8,5,.73);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .25s;}
    .overlay.show {opacity:1;pointer-events:auto;}
    .modal {width:min(100%,365px);position:relative; padding:27px 23px 23px; background:linear-gradient(155deg,#fff6e9,#ffe3c3); color:#57301c; border:3px solid #ffd48f;border-radius:24px;box-shadow:0 19px 0 -10px #9e4325,0 26px 70px #100803a6;text-align:center;transform:translateY(16px) scale(.96);transition:transform .32s cubic-bezier(.2,1.25,.5,1);}
    .overlay.show .modal {transform:translateY(0) scale(1)}
    .medal {width:66px;height:66px;margin:-59px auto 14px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(155deg,#ffdf9d,#e6a047);border:5px solid #fff3d9;box-shadow:0 5px 16px #87381744;font-size:32px;}
    .modal h2 {font-size:25px;line-height:1.2;margin:0 0 8px;color:#a83e27;font-weight:950;}
    .modal .lost {font-size:13px;color:#95664a;margin:0 0 17px;}
    .message {margin:0 0 20px;font-size:17px;line-height:1.7;font-weight:750;}
    .message strong {color:#d43f29;}
    .claim {display:block;width:100%;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(180deg,#f86949,#da3625);color:white;box-shadow:0 5px 0 #a52c1b;font-size:16px;font-weight:900;padding:14px 10px;letter-spacing:.025em;}
    .claim:active {transform:translateY(3px);box-shadow:0 2px 0 #a52c1b;}
    .modal-note {font-size:11px;color:#a57b61;margin:15px 0 0;}

    @media (max-height:720px) {
      .hero { gap:5px;padding-top:10px;padding-bottom:7px;}
      .rule {margin-top:2px}
      .game { gap:7px }
      .beneath {gap:4px}
      .footer {padding:4px 0 1px}
    }
    @media (max-height:590px) {
      .hero-title {font-size:clamp(24px,7vw,34px)}
      .title-pill {font-size:16px;padding:5px 20px}
      .rule {font-size:10px}
      .hero {padding:5px 0}
      .wheel-wrap {width:min(calc(100vw - 68px),calc(100dvh - 248px),400px)}
      .footer {padding:2px 0}
      .segment .emoji {font-size:16px}
      .segment .level {font-size:11px}
      .segment .reward {font-size:10px}
    }
    @media (prefers-reduced-motion:reduce) {
      .embers i {animation:none}
      .wheel.spinning {transition-duration:.4s}
      .overlay, .modal {transition-duration:.1s}
    }
  </style>
</head>
<body>
<main class="page">
  <div class="embers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <header class="hero">
    <h1 class="hero-title">开业大酬宾</h1>
    <div class="title-accent"><div class="title-pill">抽霸王餐</div></div>
    <div class="rule" aria-hidden="true"></div>
  </header>

  <section class="game" aria-label="四等奖幸运转盘">
    <div class="wheel-wrap">
      <div class="wheel-shadow" aria-hidden="true"></div>
      <div id="wheel" class="wheel" aria-hidden="true">
        <div class="segment top"><span class="emoji">🥩</span><span class="level">一等奖</span><span class="reward">霸王餐</span></div>
        <div class="segment right"><span class="emoji">🍢</span><span class="level">二等奖</span><span class="reward">赠送菜品一份</span></div>
        <div class="segment bottom"><span class="emoji">💰</span><span class="level">三等奖</span><span class="reward">立减十元</span></div>
        <div class="segment left"><span class="emoji">🎁</span><span class="level">四等奖</span><span class="reward">安慰奖</span></div>
      </div>
      <div class="pointer" aria-hidden="true"></div>
      <button id="spinBtn" class="spin-btn" type="button" aria-label="点击抽奖"><span>点击</span><span>抽奖</span></button>
    </div>
    <div class="beneath"><p id="hint" class="hint">点击转盘中央，试试手气吧！</p><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div></div>
  </section>
  <footer class="footer"><span aria-hidden="true">✦ ✦ ✦</span></footer>
</main>

<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="prizeTitle" aria-describedby="prizeMessage" aria-hidden="true">
  <div class="modal">
    <div class="medal" aria-hidden="true">🎁</div>
    <h2 id="prizeTitle">四等奖 · 安慰奖</h2>
    <p class="lost">差一点就抽中大奖啦！</p>
    <p id="prizeMessage" class="message">别灰心！<br>看 <strong>10秒广告</strong>，<br>获得一次<strong>额外抽奖机会</strong>！</p>
    <button id="claimBtn" type="button" class="claim">领取额外一次抽奖机会 →</button>
    <p class="modal-note">好运可能就在下一次 ✨</p>
  </div>
</div>
<script>
  (() => {
    // 唯一跳转目标：生日惊喜网页。此页面是趣味惊喜互动，没有真实奖品或广告投放。
    const SURPRISE_URL = 'https://gatitosignal.github.io/forTianYu/';
    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const hint = document.getElementById('hint');
    const overlay = document.getElementById('overlay');
    const claimBtn = document.getElementById('claimBtn');
    let hasSpun = false;

    spinBtn.addEventListener('click', () => {
      if (hasSpun) return;
      hasSpun = true;
      spinBtn.disabled = true;
      spinBtn.innerHTML = '<span>抽奖</span><span>中…</span>';
      hint.textContent = '好运正在赶来的路上…';
      // 左侧“四等奖”扇区顺时针旋转 90° 抵达顶部指针；额外旋转五圈营造抽奖效果。
      wheel.classList.add('spinning');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.setTimeout(() => {
        hint.textContent = '恭喜获得四等奖：安慰奖！';
        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden', 'false');
        claimBtn.focus();
      }, reducedMotion ? 500 : 4650);
    });

    // 按用户指定的生日惊喜流程：按钮直接跳转，不进行第二次真实抽奖或播放商业广告。
    claimBtn.addEventListener('click', () => {
      window.location.assign(SURPRISE_URL);
    });
  })();
</script>
</body>
</html>
